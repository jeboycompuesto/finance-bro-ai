<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance Bro AI</title>
<meta name="description" content="Finance Bro AI product demo: turn live financial data and a business question into a decision you can defend.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Finance Bro AI — product demo styles
   Follows the Finance Bro AI design system (Figma: NgrotxV7Njc0D60IIEgRJo), Wise-inspired:
   white screens, flat neutral cards, lime as the hero fill, navy as the ink, pills for actions.
   Lime is a fill, never a text color. Provenance stays part of the visual language:
   ACTUAL chips are solid blue, ASSUMPTION chips are dashed (a belief about the future). */

:root {
  /* surfaces */
  --paper: #ffffff;          /* bg/canvas */
  --surface: #ffffff;        /* rows and inputs inside cards */
  --surface-2: #f0f2f5;      /* bg/subtle: cards */
  --surface-3: #e4e8ed;      /* neutral hover, tracks */
  /* ink */
  --ink: #14213d;            /* navy: text/primary, controls, focus */
  --ink-2: #3f4754;          /* text/secondary */
  --muted: #535c6a;          /* text/muted (6.0:1 on cards) */
  --rule: #dfe3e9;
  --rule-strong: #aeb6c1;
  --link: #285e99;
  /* brand + actions */
  --lime: #a1d459;
  --blue: #3d8fe3;
  --orange: #f9834f;
  --accent: #a1d459;         /* action/primary (fill) */
  --accent-hover: #b8de81;
  --accent-pressed: #84af48;
  --accent-ink: #14213d;     /* text on lime */
  --accent-soft: #f0f8e4;    /* action/secondary */
  --accent-soft-hover: #e1f1ca;
  /* sentiment: *-fill for marks, plain for text on *-soft */
  --good: #4f6b29;
  --good-fill: #a1d459;
  --warn: #833d22;
  --warn-fill: #f9834f;
  --warn-soft: #feebe3;
  --crit: #992e31;
  --crit-fill: #bd3a3e;
  --crit-soft: #fbe2e3;
  /* provenance */
  --prov-bg: #e0edfb;
  --prov-ink: #1e4776;
  /* charts */
  --chart-focus: #14213d;
  --chart-muted: #aeb6c1;
  --chart-grid: #e4e8ed;
  --overlay: rgba(20, 33, 61, 0.45);
  --shadow-hover: 0 6px 20px rgba(20, 33, 61, 0.10);
  --shadow: 0 10px 32px rgba(20, 33, 61, 0.08), 0 40px 40px -12px rgba(20, 33, 61, 0.10);

  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --r-xs: 6px;
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 24px;
  --r-xl: 32px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10141b;
    --surface: #1b2029;
    --surface-2: #2b323d;
    --surface-3: #3f4754;
    --ink: #f8f9fb;
    --ink-2: #cfd5dd;
    --muted: #aeb6c1;
    --rule: #3f4754;
    --rule-strong: #6b7584;
    --link: #9ac5f0;
    --accent-soft: #374c1b;
    --accent-soft-hover: #4f6b29;
    --good: #cee9a9;
    --warn: #fcbfa3;
    --warn-soft: #602915;
    --crit: #f1a0a2;
    --crit-fill: #e5484d;
    --crit-soft: #541618;
    --prov-bg: #153256;
    --prov-ink: #c1dbf6;
    --chart-focus: #b8de81;
    --chart-muted: #6b7584;
    --chart-grid: #2b323d;
    --overlay: rgba(0, 0, 0, 0.6);
    --shadow-hover: 0 6px 20px rgba(0, 0, 0, 0.4);
    --shadow: 0 10px 32px rgba(0, 0, 0, 0.5), 0 40px 40px -12px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10141b;
  --surface: #1b2029;
  --surface-2: #2b323d;
  --surface-3: #3f4754;
  --ink: #f8f9fb;
  --ink-2: #cfd5dd;
  --muted: #aeb6c1;
  --rule: #3f4754;
  --rule-strong: #6b7584;
  --link: #9ac5f0;
  --accent-soft: #374c1b;
  --accent-soft-hover: #4f6b29;
  --good: #cee9a9;
  --warn: #fcbfa3;
  --warn-soft: #602915;
  --crit: #f1a0a2;
  --crit-fill: #e5484d;
  --crit-soft: #541618;
  --prov-bg: #153256;
  --prov-ink: #c1dbf6;
  --chart-focus: #b8de81;
  --chart-muted: #6b7584;
  --chart-grid: #2b323d;
  --overlay: rgba(0, 0, 0, 0.6);
  --shadow-hover: 0 6px 20px rgba(0, 0, 0, 0.4);
  --shadow: 0 10px 32px rgba(0, 0, 0, 0.5), 0 40px 40px -12px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
.btn:focus-visible, .chip:focus-visible, .step:focus-visible { border-radius: 999px; }
.num { font-variant-numeric: tabular-nums; }
.boot { padding: 48px; color: var(--muted); font-family: var(--font-mono); font-size: 13px; }

/* ---------- type ---------- */
h1, h2, h3 { font-family: var(--font-body); margin: 0; text-wrap: balance; }
.h1 { font-size: 30px; line-height: 34px; font-weight: 600; letter-spacing: -0.025em; }
.h2 { font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.015em; }
.h3 { font-size: 18px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em; }
.display { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: -0.035em; }
.lede { color: var(--muted); font-size: 16px; max-width: 68ch; margin: 6px 0 0; }
.eyebrow {
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
}
.small { font-size: 14px; }
.muted { color: var(--muted); }
.strong { font-weight: 600; }
.big-number { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }

/* ---------- brand ---------- */
.brand { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; color: var(--ink); }
.brand-mark { width: 26px; height: 27px; flex: none; display: block; }
.wordmark { font-family: var(--font-display); font-weight: 800; font-size: 21px; letter-spacing: -0.03em; line-height: 1; }
.wordmark span { color: var(--blue); }
.brand-tag { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: 0.06em; padding: 2px 6px; border-radius: var(--r-xs); background: var(--surface-2); color: var(--muted); }

/* ---------- shell ---------- */
.app { min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
  padding: 12px 32px; background: var(--paper); border-bottom: 1px solid var(--rule);
}
.nav { display: flex; align-items: center; gap: 4px; }
.nav button {
  background: none; border: 0; padding: 8px 14px; border-radius: 999px;
  color: var(--muted); font-weight: 500; font-size: 15px;
}
.nav button:hover { color: var(--ink); background: var(--surface-2); }
.nav button[aria-current="page"] { color: var(--ink); font-weight: 600; background: var(--surface-2); }
.sync { font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good-fill); }
.nav .sync-bad { color: var(--crit); font-family: var(--font-mono); font-size: 12px; }
.nav .sync-bad::before { background: var(--crit-fill); }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 14px 18px; border-radius: var(--r-md); background: var(--surface-2); }
.banner-crit { background: var(--crit-soft); }
.banner-warn { background: var(--warn-soft); }
.stale { opacity: 0.45; filter: grayscale(1); pointer-events: none; user-select: none; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); }
.tabs button { background: none; border: 0; padding: 10px 12px; font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.modal.modal-wide { max-width: 980px; }
.dropzone { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 36px 24px; border-radius: var(--r-lg); border: 2px dashed var(--rule-strong); background: var(--surface); text-align: center; }
.dropzone.drag { border-color: var(--ink); background: var(--accent-soft); }
.finding { display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; padding: 14px; border-radius: var(--r-md); border: 2px solid transparent; background: var(--surface); }
.finding:hover { box-shadow: var(--shadow-hover); }
.finding[aria-current="true"] { border-color: var(--ink); }
.code { font-family: var(--font-mono); font-size: 14px; padding: 8px 12px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--rule); }
.code.after { border: 2px solid var(--good-fill); }
.tag.sev-High { background: var(--crit-soft); color: var(--crit); border-color: transparent; }
.tag.sev-Medium { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.tag.sev-Low { background: var(--surface-3); color: var(--ink-2); border-color: transparent; }
table.data.calc td, table.data.calc th { padding: 8px 10px; font-size: 13px; }
table.data.calc td { text-align: right; }
table.data.calc td:first-child, table.data.calc th:first-child { text-align: left; }
table.data.calc th { text-align: right; }
table.data tr.below td { color: var(--crit); }
.inline-form { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr) 130px auto; gap: 10px; align-items: end; }
@media (max-width: 900px) { .inline-form { grid-template-columns: minmax(0, 1fr); } }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--accent-ink); }

.setupbar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 10px 32px; background: var(--surface-2);
}
.setup-steps { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.setup-steps .line { width: 22px; height: 1px; background: var(--rule-strong); }

.page { width: 100%; max-width: 1240px; margin: 0 auto; padding: 32px 32px 80px; display: flex; flex-direction: column; gap: 24px; }
.page-narrow { max-width: 940px; }
.crumbs { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); }
.crumbs button { background: none; border: 0; padding: 0; color: var(--muted); }
.crumbs button:hover { color: var(--ink); text-decoration: underline; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
.grid-main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; align-items: start; }
.grid-main.rail-left { grid-template-columns: 380px minmax(0, 1fr); }
.grid-main.rail-wide { grid-template-columns: minmax(0, 1fr) 440px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; align-items: center; gap: 12px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wrap { flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.footer-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-top: 4px; flex-wrap: wrap; }

@media (max-width: 1080px) {
  .grid-main, .grid-main.rail-left, .grid-main.rail-wide { grid-template-columns: minmax(0, 1fr); }
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: minmax(0, 1fr); }
  .page { padding: 20px 16px 56px; }
  .topbar, .setupbar { padding: 10px 16px; }
  .topbar .hide-sm, .sync, .nav .avatar, .brand-tag { display: none; }
  .brand { white-space: nowrap; gap: 6px; }
  .wordmark { font-size: 17px; }
  .topbar .brand-mark { width: 22px; height: 23px; }
  .topbar { gap: 4px; }
  .nav { gap: 0; }
  .nav button { padding: 6px 8px; font-size: 14px; }
  .page .hero { padding: 20px; border-radius: var(--r-lg); }
  .page .btn { white-space: normal; text-align: center; }
  .page .grid-4[style] { grid-template-columns: minmax(0, 1fr) !important; } /* goal rows stack on phones */
  .footer-bar .row { flex-wrap: wrap; }
  .big-ask { padding-left: 16px; }
  .big-ask input { font-size: 16px; }
  .h1 { font-size: 26px; line-height: 30px; }
  .display { font-size: 34px; }
}

/* ---------- surfaces ----------
   Flat by default: cards are neutral with no border or shadow.
   Anything nested in a card (or a neutral panel) turns white, like Wise list rows. */
.card { background: var(--surface-2); border-radius: var(--r-lg); }
.pad { padding: 24px; }
.pad-sm { padding: 16px; }
.panel { background: var(--surface-2); border-radius: var(--r-md); padding: 16px; }
.card .panel, .panel .card, .panel .panel { background: var(--surface); }
.card-emph { box-shadow: inset 0 0 0 2px var(--ink); }
.divider-list > * + * { border-top: 1px solid var(--rule); }
.hero { background: var(--lime); color: var(--accent-ink); border-radius: var(--r-xl); padding: 32px; }
.hero .eyebrow, .hero .muted { color: var(--accent-ink); opacity: 0.78; }
/* Brand panels look the same in both themes: white rows, navy ink. */
.hero .card, .hero .area-tile, .hero .big-ask { background: #fff; color: #14213d; }
.hero .card .muted, .hero .area-tile .p, .hero .big-ask input::placeholder { color: #535c6a; opacity: 1; }
.hero .big-ask:focus-within { border-color: #14213d; }
.hero .btn-dark { background: #14213d; color: #fff; }
.hero .btn-dark:hover { background: #2a3a5c; }
.hero .btn-secondary { background: #f0f8e4; color: #14213d; }
.hero .btn-secondary:hover { background: #e1f1ca; }
.hero .area-tile.live .t::after { color: #4f6b29; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 20px; border-radius: 999px; border: 0;
  font-weight: 600; font-size: 15px; line-height: 1.2; white-space: nowrap;
  transition: background-color 0.15s, color 0.15s;
}
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active { background: var(--accent-pressed); }
.btn-dark { background: var(--ink); color: var(--paper); }
.btn-dark:hover { background: var(--ink-2); }
.btn-secondary { background: var(--accent-soft); color: var(--ink); }
.btn-secondary:hover { background: var(--accent-soft-hover); }
.btn-ghost { background: none; color: var(--ink); padding-left: 6px; padding-right: 6px; text-decoration: underline; text-underline-offset: 3px; }
.btn-ghost:hover { color: var(--ink-2); }
.btn-quiet { background: none; border: 0; color: var(--muted); font-weight: 500; padding: 6px 8px; min-height: 0; }
.btn-quiet:hover { color: var(--ink); }
.btn:disabled { background: var(--surface-3); color: var(--muted); cursor: not-allowed; text-decoration: none; }
.btn-lg { min-height: 52px; padding: 14px 28px; font-size: 16px; }
.btn-sm { min-height: 32px; padding: 6px 14px; font-size: 14px; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--rule); font-size: 14px; font-weight: 500; color: var(--ink);
}
button.chip:hover { background: var(--surface-3); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.tag {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: var(--r-xs);
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase;
  border: 1px solid transparent; color: var(--ink-2); background: var(--surface-3); white-space: nowrap;
}
.tag-actual { background: var(--prov-bg); color: var(--prov-ink); }
.tag-assumption { background: transparent; color: var(--ink-2); border: 1.5px dashed var(--rule-strong); }
.tag-goal { background: transparent; color: var(--good); border: 1.5px solid var(--good); }
.tag-good { background: var(--accent-soft); color: var(--good); }
.tag-warn { background: var(--warn-soft); color: var(--warn); }
.tag-crit { background: var(--crit-soft); color: var(--crit); }
.tag-dark { background: var(--ink); color: var(--paper); }
.tag-dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.field { display: flex; flex-direction: column; gap: 8px; }
.field-label { font-weight: 600; font-size: 14px; }
.help { font-size: 14px; color: var(--muted); }
.input, .select {
  width: 100%; min-height: 48px; padding: 11px 14px; border-radius: var(--r-sm); border: 1px solid var(--rule-strong);
  background: var(--surface); font-size: 16px; font-variant-numeric: tabular-nums;
}
.input:focus, .select:focus { outline: 2px solid var(--ink); outline-offset: -1px; border-color: var(--ink); }
.input-money { position: relative; }
.input-money .input { padding-left: 26px; }
.input-money::before { content: "$"; position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.input-error { border-color: var(--crit-fill); }
.big-ask {
  display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 22px; border-radius: 999px;
  background: var(--surface); color: var(--ink); border: 2px solid transparent;
}
.big-ask input { flex: 1; border: 0; background: transparent; font-size: 18px; padding: 8px 0; min-width: 0; }
.big-ask input::placeholder { color: var(--muted); }
.big-ask input:focus { outline: none; }
.big-ask:focus-within { border-color: var(--ink); }

.seg { display: inline-flex; align-self: flex-start; gap: 2px; padding: 3px; background: var(--surface-3); border-radius: 999px; }
.seg button { background: transparent; border: 0; padding: 7px 14px; font-size: 14px; font-weight: 600; border-radius: 999px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

.check {
  display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
  padding: 14px 16px; border-radius: var(--r-md); background: var(--surface); border: 2px solid transparent;
}
.check:hover { box-shadow: var(--shadow-hover); }
.check[aria-pressed="true"] { border-color: var(--ink); }
.check-box {
  width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--rule-strong); flex: none; margin-top: 1px;
  display: grid; place-items: center; color: var(--paper); font-size: 12px; line-height: 1;
}
.check[aria-pressed="true"] .check-box { background: var(--ink); border-color: var(--ink); }

input[type="range"].slider { width: 100%; accent-color: var(--ink); height: 28px; }

/* ---------- stepper ---------- */
.stepper { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.step {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px;
  font-size: 14px; font-weight: 500; background: var(--surface-2); color: var(--muted);
}
.step.done { color: var(--ink); background: var(--accent-soft); }
.step.current { background: var(--ink); color: var(--paper); font-weight: 600; }
.setupbar .step { background: var(--surface); }
.setupbar .step.done { background: var(--accent-soft); }
.setupbar .step.current { background: var(--ink); }
.step-line { width: 18px; height: 1px; background: var(--rule-strong); }

/* ---------- lists & tables ---------- */
.kv { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; }
.kv .k { color: var(--muted); }
.kv .v { font-weight: 600; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.data th {
  text-align: left; font-family: var(--font-mono); font-weight: 500; font-size: 11px; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--rule);
}
table.data td { padding: 11px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.data td.first, table.data td:nth-child(2) { white-space: nowrap; }
table.data tr:last-child td { border-bottom: 0; }
table.data tr.emph td { background: var(--accent-soft); font-weight: 600; }
table.data tr.emph td:first-child { border-radius: 10px 0 0 10px; }
table.data tr.emph td:last-child { border-radius: 0 10px 10px 0; }
table.data td.first { font-weight: 600; }
table.data tr.total td { background: var(--surface); font-weight: 600; }

.progress { height: 8px; border-radius: 999px; background: var(--surface-3); position: relative; }
.progress > span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--ink); }
.progress.good > span { background: var(--good-fill); }
.progress.warn > span { background: var(--warn-fill); }
.progress.crit > span { background: var(--crit-fill); }
.progress .marker { position: absolute; top: -4px; width: 4px; height: 16px; border-radius: 2px; background: var(--surface); box-shadow: 0 0 0 2px var(--ink); }

/* ---------- specific components ---------- */
.integration {
  display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: var(--r-md);
  border: 2px solid transparent; background: var(--surface); text-align: left; min-height: 124px;
}
button.integration:hover { box-shadow: var(--shadow-hover); }
.integration.connected { border-color: var(--good-fill); background: var(--accent-soft); }
.integration.planned { border: 1.5px dashed var(--rule-strong); background: transparent; }
.logo {
  width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--rule); display: grid; place-items: center;
  font-weight: 700; font-size: 14px; color: var(--ink); flex: none;
}
.integration.connected .logo { background: var(--surface); }
.spinner {
  width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--rule-strong); border-top-color: var(--ink);
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.area-tile {
  display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 10px 16px; border-radius: var(--r-md);
  background: var(--surface); color: var(--ink); border: 0;
}
.area-tile:hover { box-shadow: var(--shadow-hover); }
.area-tile .t { font-weight: 600; font-size: 14px; }
.area-tile .p { font-size: 13px; color: var(--muted); }
.area-tile.live .t::after { content: " ●"; color: var(--good); font-size: 10px; vertical-align: middle; }

.provenance-legend { display: flex; gap: 14px; align-items: center; font-size: 13px; color: var(--muted); }

.rec-card { display: flex; flex-direction: column; gap: 12px; }
.why { background: var(--surface); border-radius: var(--r-sm); padding: 12px 14px; }

.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 92px; gap: 12px; align-items: center; font-size: 14px; }
.bar-track { height: 10px; background: var(--surface-3); border-radius: 999px; }
.bar-fill { height: 100%; background: var(--chart-focus); border-radius: 999px; }
.bar-row .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-tip {
  position: absolute; pointer-events: none; background: var(--surface); color: var(--ink);
  box-shadow: var(--shadow); border-radius: var(--r-md); padding: 10px 14px; font-size: 13px; min-width: 190px; z-index: 5;
}
.chart-tip .tip-row { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); }
.legend-item { display: inline-flex; align-items: center; gap: 8px; }

.lineage { display: flex; justify-content: space-between; gap: 12px; align-items: center; background: var(--surface); border-radius: var(--r-sm); padding: 10px 14px; font-size: 14px; }

.chat-q { align-self: flex-end; background: var(--ink); color: var(--paper); border-radius: 18px 18px 4px 18px; padding: 10px 14px; font-size: 14px; max-width: 90%; }
.chat-a { background: var(--surface); border-radius: 18px 18px 18px 4px; padding: 10px 14px; font-size: 14px; }
.suggest { text-align: left; background: var(--surface); border: 1.5px dashed var(--rule-strong); border-radius: var(--r-sm); padding: 8px 12px; font-size: 14px; }
.suggest:hover { border-style: solid; border-color: var(--ink); }

/* ---------- loading (brand moment: lime surface, Brody) ---------- */
.loading-screen { min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; background: var(--lime); color: var(--accent-ink); }
.loading-col { width: 100%; max-width: 720px; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; }
.loading-art { width: 180px; height: 180px; border-radius: var(--r-xl); background: #fff; overflow: hidden; display: block; }
.loading-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.loading-screen .brand { color: var(--accent-ink); }
.loading-screen .brand-mark { width: 40px; height: 41px; }
.loading-screen .brand-mark path { fill: var(--accent-ink) !important; } /* Navy logo on lime */
.loading-screen .wordmark { font-size: 34px; }
.loading-screen .wordmark span { color: var(--accent-ink); }
.loading-screen .lede { color: var(--accent-ink); }
.loading-screen .progress { background: rgba(20, 33, 61, 0.14); }
.loading-screen .progress > span { background: var(--accent-ink); }
.loading-screen .btn:disabled { background: rgba(20, 33, 61, 0.14); color: rgba(20, 33, 61, 0.7); }
.loading-screen .panel { background: #fff; color: #14213d; }
.loading-screen .panel .card { background: #f0f2f5; }
.loading-screen .panel .muted { color: #535c6a; }
.loading-screen .panel .tag-dark { background: #14213d; color: #fff; }
.check-list { display: flex; flex-direction: column; gap: 6px; align-items: center; font-size: 15px; font-weight: 500; }
.check-list .pending { opacity: 0.6; }

/* ---------- overlays ---------- */
.toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast {
  background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: var(--r-md); font-size: 14px;
  box-shadow: var(--shadow); display: flex; gap: 14px; align-items: center; max-width: 420px;
  animation: toast-in 0.2s ease-out;
}
.toast button { background: none; border: 0; color: var(--paper); font-weight: 600; text-decoration: underline; padding: 0; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-back { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: center; z-index: 50; padding: 20px; }
.modal { width: 100%; max-width: 640px; max-height: 90vh; overflow: auto; background: var(--paper); border-radius: var(--r-xl); box-shadow: var(--shadow); padding: 28px; display: flex; flex-direction: column; gap: 16px; }
.brief { white-space: pre-wrap; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; background: var(--surface-2); border-radius: var(--r-sm); padding: 14px; margin: 0; }

.demo-menu { position: fixed; left: 16px; bottom: 16px; z-index: 40; }
.demo-menu > button {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  background: var(--paper); border: 1.5px dashed var(--rule-strong); color: var(--muted); padding: 7px 12px; border-radius: 999px;
}
.demo-menu .menu { position: absolute; bottom: 38px; left: 0; background: var(--paper); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 6px; min-width: 260px; max-height: calc(100vh - 80px); overflow-y: auto; display: flex; flex-direction: column; }
.demo-menu .menu button { text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: var(--r-sm); font-size: 14px; }
.demo-menu .menu button:hover { background: var(--surface-2); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

</style>

// ---- engine.js ----
// Calculation engine. Deterministic: the same inputs always give the same numbers.
// The UI never invents figures; it renders what these functions return.
// Written "explanations" are templates filled from these numbers.

const HORIZON = 12; // months shown
const PROTECT_THROUGH = 6; // keep the reserve intact through this month while raising
const RAISE_LEAD_MONTHS = 4; // assumed time from first investor talks to cash in the bank
const PAYROLL_LOAD = 0.2; // employer taxes + benefits suggested for the "missing driver" finding

// ---------- formatting ----------
const fmtMoney = (n) => {
  const sign = n < 0 ? "−" : "";
  return sign + "$" + Math.round(Math.abs(n)).toLocaleString("en-US");
};
const fmtK = (n) => {
  if (Math.round(n) === 0) return "$0";
  const sign = n < 0 ? "−" : "";
  const k = Math.abs(n) / 1000;
  return sign + "$" + (Number.isInteger(k) ? k : k.toFixed(1)) + "k";
};
const fmtMonths = (m) => (m === Infinity ? "24+" : m.toFixed(1)) + " months";
const fmtMonthsShort = (m) => (m === Infinity ? "24+" : m.toFixed(1));
const setupWhen = (month) => (month === 0 ? "before Month 1" : `in Month ${month}`);

// ---------- projection ----------
// Cash at month-end for M0..HORIZON. Runway keeps projecting past the horizon until cash reaches zero.
// `rows` is the month-by-month breakdown shown in "See calculation".
function project({
  opening, receipts, outflows,
  setup = 0, setupMonth = 0,
  extraCost = 0, extraStart = 1,
  newReceipts = 0, newStart = 999, growth = 0,
}) {
  const c0 = opening - (setupMonth === 0 ? setup : 0);
  const cash = [c0];
  const rows = [{ m: 0, start: opening, receipts: 0, newRec: 0, outflows: 0, extra: 0, setup: setupMonth === 0 ? setup : 0, end: c0 }];
  let c = c0;
  let runway = c <= 0 ? 0 : null;
  for (let m = 1; m <= 120; m++) {
    const newRec = m >= newStart ? newReceipts * Math.pow(1 + growth, m - newStart) : 0;
    const extra = m >= extraStart ? extraCost : 0;
    const oneOff = m === setupMonth ? setup : 0;
    const n = receipts + newRec - outflows - extra - oneOff;
    const prev = c;
    c = prev + n;
    if (m <= HORIZON) {
      cash.push(c);
      rows.push({ m, start: prev, receipts, newRec, outflows, extra, setup: oneOff, end: c });
    }
    if (runway === null && c <= 0) runway = m - 1 + (n < 0 ? prev / -n : 0);
    if (runway !== null && m >= HORIZON) break;
  }
  return { cash, rows, runway: runway === null ? Infinity : runway };
}

function firstMonthBelow(cash, floor) {
  for (let m = 1; m < cash.length; m++) if (cash[m] < floor) return m;
  return null;
}

// Inputs that decide the answer. If these change after a recommendation, it is out of date.
const ANSWER_INPUTS = ["setup", "setupMonth", "teamCost", "teamStart", "newReceipts", "receiptsStart", "reserve"];
function answerInputs(state) {
  const a = state.analysis;
  const out = {};
  ANSWER_INPUTS.forEach((k) => (out[k] = k === "reserve" ? a.reserve ?? state.goals.reserve : a[k]));
  return out;
}
function isStale(state) {
  const a = state.analysis;
  if (a.status !== "done" || !a.computedWith) return false;
  const now = answerInputs(state);
  return ANSWER_INPUTS.some((k) => now[k] !== a.computedWith[k]);
}
function withInputs(state, inputs) {
  const { reserve, ...rest } = inputs;
  return { ...state, analysis: { ...state.analysis, ...rest, reserve } };
}

// ---------- the NYC analysis ----------
const BASELINE = () => ({ opening: COMPANY.openingCash, receipts: COMPANY.monthlyReceipts, outflows: COMPANY.monthlyOutflows });

function buildModel(state) {
  const a = state.analysis;
  const reserve = a.reserve ?? state.goals.reserve;
  const netBurnToday = COMPANY.monthlyOutflows - COMPANY.monthlyReceipts;

  const none = project(BASELINE());
  const run = (setup, kind, over = {}) =>
    project({
      ...BASELINE(),
      setup,
      setupMonth: a.setupMonth,
      extraCost: a.teamCost,
      extraStart: a.teamStart,
      newReceipts: kind === "base" ? a.newReceipts : a.newReceipts / 2,
      newStart: kind === "base" ? a.receiptsStart : a.receiptsStart + 1,
      ...over,
    });

  const downsideAtZero = run(0, "downside");
  const rawCap = downsideAtZero.cash[PROTECT_THROUGH] - reserve;
  const cap = Math.max(0, Math.floor(rawCap / 5000) * 5000);
  const planHolds = cap >= a.setup;
  const chosen = planHolds ? a.setup : cap;

  const plan = { base: run(a.setup, "base"), downside: run(a.setup, "downside") };
  const rec = { base: run(chosen, "base"), downside: run(chosen, "downside") };
  const test = { base: run(a.testSetup, "base"), downside: run(a.testSetup, "downside") };
  const custom = a.custom
    ? run(a.custom.setup, "base", { newReceipts: a.custom.newReceipts, newStart: a.custom.receiptsStart })
    : null;

  const breach = firstMonthBelow(rec.downside.cash, reserve);
  const raiseBy = breach ? Math.max(1, breach - RAISE_LEAD_MONTHS) : null;
  const verdict = rawCap <= 0 ? "Not viable yet" : planHolds ? "Viable as planned" : "Viable with conditions";

  const downStart = a.receiptsStart + 1;
  const downReceipts = COMPANY.monthlyReceipts + a.newReceipts / 2;
  const costsWithNyc = COMPANY.monthlyOutflows + a.teamCost;
  const burnBefore = costsWithNyc - COMPANY.monthlyReceipts;
  const burnAfter = costsWithNyc - downReceipts;

  const planM6 = plan.downside.cash[PROTECT_THROUGH];
  const range = a.setupRange;
  const rangeNote = !range
    ? null
    : cap >= range.high
      ? `Your whole ${fmtK(range.low)}–${fmtK(range.high)} range keeps the reserve.`
      : cap >= range.low
        ? `Only the low end of your ${fmtK(range.low)}–${fmtK(range.high)} range is safe: up to ${fmtK(cap)}.`
        : `Even the low end of your ${fmtK(range.low)}–${fmtK(range.high)} range breaks the reserve.`;

  const headline = verdict === "Not viable yet"
    ? `Hold off on NYC — even with no setup cost, the downside breaks your ${fmtK(reserve)} reserve by Month ${PROTECT_THROUGH}.`
    : planHolds
      ? `Your ${fmtK(a.setup)} NYC plan holds — start fundraising conversations by Month ${raiseBy ?? HORIZON}.`
      : `Cap NYC setup at ${fmtK(cap)} — and start fundraising conversations by Month ${raiseBy}.`;

  const what = planM6 < reserve
    ? `At ${fmtK(a.setup)} setup, the downside case drops to ${fmtK(planM6)} by Month ${PROTECT_THROUGH} — ${fmtK(reserve - planM6)} below your ${fmtK(reserve)} reserve.`
    : `At ${fmtK(a.setup)} setup, the downside case still holds ${fmtK(planM6)} at Month ${PROTECT_THROUGH}, above your ${fmtK(reserve)} reserve.`;
  const why = `Setup is paid ${a.setupMonth === 0 ? "upfront" : `in Month ${a.setupMonth}`}, and in the downside NYC cash arrives a month later at half the rate (${fmtK(a.newReceipts / 2)}/mo from Month ${downStart}).`;
  const next = verdict === "Not viable yet"
    ? `Delay NYC or line up funding first. Revisit once receipts grow or costs fall.`
    : `${planHolds ? "Keep" : "Cap"} setup at ${fmtK(chosen)} to hold the reserve through Month ${PROTECT_THROUGH}. Runway still falls from ${fmtMonthsShort(none.runway)} to ~${Math.floor(rec.downside.runway)} months, so line up a raise.`;

  return {
    reserve, netBurnToday, none, plan, rec, test, custom, cap, chosen, planHolds, breach, raiseBy, verdict,
    headline, what, why, next, rangeNote,
    downStart, downReceipts, costsWithNyc, burnBefore, burnAfter,
    noneBreach: firstMonthBelow(none.cash, reserve),
    run,
  };
}

// ---------- goals on Home ----------
const monthNumber = (label) => parseInt(String(label).replace(/\D/g, ""), 10) || 1;

function goalMetrics(state, model) {
  const g = state.goals;
  const done = state.analysis.status === "done";
  const out = [];
  if (g.selected.reserve) {
    const monthsToFloor = (COMPANY.openingCash - g.reserve) / model.netBurnToday;
    out.push({
      id: "reserve", label: "Cash reserve floor", value: `${fmtK(COMPANY.openingCash)} cash · floor ${fmtK(g.reserve)}`,
      pct: 1, marker: g.reserve / COMPANY.openingCash,
      status: done && model.breach ? "At risk later" : "On track",
      tone: done && model.breach ? "warn" : "good",
      note: done && model.breach
        ? `Holds today. With the NYC plan, cash dips below the floor from Month ${model.breach}.`
        : `Holds today · about ${monthsToFloor.toFixed(1)} months until the floor at today’s burn.`,
    });
  }
  const savings = (id, label, target, saved, by, noteLead) => {
    const left = Math.max(0, target - saved);
    const pct = target > 0 ? Math.min(1, saved / target) : 0;
    return {
      id, label, value: `${fmtK(saved)} of ${fmtK(target)}`, pct,
      status: pct >= 1 ? "Funded" : "On track", tone: "good",
      note: pct >= 1 ? "Fully set aside." : `${noteLead || `${Math.round(pct * 100)}% set aside`} · ${fmtK(left / monthNumber(by))}/mo more funds it by ${by}.`,
    };
  };
  if (g.selected.expand) {
    const target = state.nycTargetUpdated ? model.chosen : g.nyc.target;
    out.push(savings("nyc", "NYC team fund", target, g.nyc.saved, g.nyc.by,
      state.nycTargetUpdated ? `Target lowered from ${fmtK(g.nyc.target)} after your NYC analysis` : null));
  }
  if (g.selected.hire) out.push(savings("hiring", "Hiring fund · 2 engineers", g.hiring.target, g.hiring.saved, g.hiring.by));
  (g.custom || []).forEach((c) => out.push(savings(c.id, c.name || "New goal", c.target || 0, c.saved || 0, c.by)));
  if (g.selected.runway) {
    const today = model.none.runway;
    const needBurn = COMPANY.openingCash / g.runwayTarget;
    const cut = Math.max(0, model.netBurnToday - needBurn);
    out.push({
      id: "runway", label: "Runway target", value: `${fmtMonthsShort(today)} of ${g.runwayTarget} months`,
      pct: Math.min(1, today / g.runwayTarget),
      status: today >= g.runwayTarget ? "On track" : "Behind", tone: today >= g.runwayTarget ? "good" : "crit",
      note: today >= g.runwayTarget ? "You already clear your runway target." : `Raise, or cut ~${fmtK(Math.round(cut / 100) * 100)}/mo of burn, to reach ${g.runwayTarget} months.`,
    });
  }
  return out;
}

// ---------- recommendations ----------
function buildRecommendations(state, model) {
  const done = state.analysis.status === "done";
  const r = [];
  if (done) {
    r.push({
      id: "raise", category: "Prepare funding", impact: "High", title: `Start raise talks by Month ${model.raiseBy}`,
      metric: `Runway ${fmtMonthsShort(model.none.runway)} → ~${Math.floor(model.rec.downside.runway)} months`,
      why: `With the NYC plan, cash drops below your ${fmtK(model.reserve)} reserve from Month ${model.breach}. Raises usually take about ${RAISE_LEAD_MONTHS} months, so start before the floor is at risk.`,
      basis: "NYC team analysis", provenance: "assumption", action: "Open NYC analysis", go: "recommendation",
    });
    if (!model.planHolds) {
      r.push({
        id: "cap", category: "Protect reserve", impact: "High", title: `Cap NYC setup at ${fmtK(model.cap)}, release the rest in stages`,
        metric: `Keeps your ${fmtK(model.reserve)} floor through Month ${PROTECT_THROUGH}`,
        why: `At ${fmtK(state.analysis.setup)} setup, the downside falls to ${fmtK(model.plan.downside.cash[PROTECT_THROUGH])} by Month ${PROTECT_THROUGH}. Release more only once NYC receipts reach ${fmtK(state.analysis.newReceipts)}/mo.`,
        basis: "NYC team analysis · downside", provenance: "assumption", action: "See scenarios", go: "scenarios",
      });
    }
  } else {
    r.push({
      id: "model", category: "Protect reserve", impact: "High", title: "Test the NYC plan before you commit",
      metric: `Floor reached in Month ${model.noneBreach} at today’s burn`,
      why: `You plan ${fmtK(state.goals.nyc.target)} for NYC plus ongoing team costs. Without NYC, cash already reaches your ${fmtK(model.reserve)} floor in Month ${model.noneBreach}. Model it to see how much sooner.`,
      basis: "Bank balances + your goals", provenance: "actual", action: "Model this", go: "questions",
    });
    r.push({
      id: "raise", category: "Prepare funding", impact: "Medium", title: `Plan raise talks by Month ${Math.max(1, model.noneBreach - RAISE_LEAD_MONTHS)}`,
      metric: `Runway ${fmtMonthsShort(model.none.runway)} months today`,
      why: `At a ${fmtK(model.netBurnToday)}/mo net burn you reach the reserve floor in Month ${model.noneBreach}. Raises usually take about ${RAISE_LEAD_MONTHS} months.`,
      basis: "Bank transactions · last 6 months", provenance: "actual", action: "Model raise timing", go: "questions",
    });
  }
  r.push({
    id: "tools", category: "Save money", impact: "Medium", title: `Review ${COMPANY.overlappingTools.count} overlapping software tools`,
    metric: `~${fmtK(COMPANY.overlappingTools.monthlySaving)} / month`,
    why: `Software is ${fmtK(COMPANY.costDrivers[2].amount)}/mo. Three charges look like tools in the same category. We see charges, not usage — confirm before cancelling.`,
    basis: "Bank transactions · last 6 months", provenance: "actual", action: "Review charges", go: null,
  });
  const inv = COMPANY.overdueInvoices;
  r.push({
    id: "invoices", category: "Working capital", impact: "Medium", title: `Chase ${inv.count} invoices unpaid for ${inv.days}+ days`,
    metric: `${fmtK(inv.amount)} in sooner ≈ ${Math.round((inv.amount / model.netBurnToday) * 30 / 7)} weeks of burn`,
    why: `Two customer invoices are past ${inv.days} days. Collecting them now eases the cash dip${done ? " while NYC ramps up" : ""}.`,
    basis: "QuickBooks invoices", provenance: "actual", action: "See invoices", go: null,
  });
  return r.filter((x) => !state.hiddenRecs[x.id]);
}

// ---------- canned "Ask about this analysis" answers (templated from the model) ----------
function askAnswers(state, model) {
  const a = state.analysis;
  const alt = buildModel({ ...state, analysis: { ...a, receiptsStart: 2 } });
  return [
    {
      q: `Why does runway drop by ${(model.none.runway - model.rec.downside.runway).toFixed(1)} months?`,
      a: `The ${fmtK(a.teamCost)}/mo NYC team cost is larger than new receipts (${fmtK(a.newReceipts / 2)}–${fmtK(a.newReceipts)}/mo), so net burn rises from ${fmtK(model.netBurnToday)} to ${fmtK(model.burnAfter)}/mo in the downside — on top of the ${fmtK(model.chosen)} one-time setup.`,
    },
    {
      q: `Why ${fmtK(model.chosen)} and not ${fmtK(a.setup)}?`,
      a: `With no setup cost, the downside would hold ${fmtK(model.plan.downside.cash[PROTECT_THROUGH] + a.setup)} at Month ${PROTECT_THROUGH}. Keeping ${fmtK(model.reserve)} leaves room for about ${fmtK(model.cap)} of setup, rounded down to the nearest $5k.`,
    },
    {
      q: "What if NYC receipts start in Month 2?",
      a: `Then the cap rises to ${fmtK(alt.cap)} and downside runway becomes ~${fmtMonthsShort(alt.rec.downside.runway)} months. Try it with “NYC receipts start” on the scenarios step.`,
    },
    {
      q: "How is this calculated?",
      a: `Month by month: cash = last month + ${fmtK(COMPANY.monthlyReceipts)} receipts + new NYC receipts − ${fmtK(COMPANY.monthlyOutflows)} costs − ${fmtK(a.teamCost)} NYC team. Setup comes off ${setupWhen(a.setupMonth)}. The downside halves NYC receipts and starts them a month later.`,
      calc: true,
    },
  ];
}

// ---------- Validate: findings for the uploaded model ----------
// The sample workbook is the NYC base plan with four problems a reviewer should catch.
function validationFindings(state, model) {
  const a = state.analysis;
  const base = model.plan.base;
  const correctedM6 = base.cash[PROTECT_THROUGH];
  const teamMonths = Math.max(0, PROTECT_THROUGH - a.teamStart + 1);
  const omitted = a.teamCost * teamMonths;

  const grown = project({ ...BASELINE(), setup: a.setup, setupMonth: a.setupMonth, extraCost: a.teamCost, extraStart: a.teamStart, newReceipts: a.newReceipts, newStart: a.receiptsStart, growth: 0.25 });
  const m12Grown = a.newReceipts * Math.pow(1.25, HORIZON - a.receiptsStart);
  const overstatement = grown.cash[HORIZON] - base.cash[HORIZON];

  const loadMonthly = Math.round((a.teamCost * PAYROLL_LOAD) / 500) * 500 || 0;
  const loaded = project({ ...BASELINE(), setup: a.setup, setupMonth: a.setupMonth, extraCost: a.teamCost + loadMonthly, extraStart: a.teamStart, newReceipts: a.newReceipts, newStart: a.receiptsStart });

  return [
    {
      id: "formula", type: "Formula error", severity: "High",
      title: "Operating costs are left out of the monthly outflow total",
      short: "Operating costs left out of the total",
      location: "Forecast!C24:H24",
      found: `The total sums rows 19–23 and skips row 18, “Ongoing NYC team costs” (${fmtK(a.teamCost)} × ${teamMonths} months = ${fmtK(omitted)}).`,
      diff: { before: "=SUM(C19:C23)", after: "=SUM(C18:C23)" },
      why: `The model makes the NYC plan look ${fmtK(omitted)} cheaper than it is. Anyone reading the summary would see a buffer that doesn’t exist.`,
      impact: [
        { label: `Month-${PROTECT_THROUGH} ending cash`, before: fmtK(correctedM6 + omitted), after: fmtK(correctedM6) },
        { label: `Buffer above ${fmtK(model.reserve)} reserve`, before: fmtK(correctedM6 + omitted - model.reserve), after: fmtK(correctedM6 - model.reserve) },
      ],
      approveLabel: "Approve change",
      detail: "Checked by rebuilding the total from the rows it should include. Deterministic — not an AI judgment.",
    },
    {
      id: "growth", type: "Unrealistic growth", severity: "Medium",
      title: "NYC receipts grow 25% every month",
      short: "NYC receipts grow 25% month over month",
      location: "Assumptions!B9",
      found: `From Month ${a.receiptsStart}, NYC receipts compound 25% a month, reaching ${fmtK(m12Grown)}/mo by Month ${HORIZON}. Your total receipts grew about ${Math.round(COMPANY.receiptsGrowth * 100)}% a month over the last 18 months.`,
      why: "Growth this steep is possible but unproven for a new city. The downside should not depend on it.",
      impact: [
        { label: `NYC receipts in Month ${HORIZON}`, before: `${fmtK(m12Grown)}/mo`, after: `${fmtK(a.newReceipts)}/mo` },
        { label: `Month-${HORIZON} cash overstated by`, before: fmtK(overstatement), after: "$0" },
      ],
      approveLabel: `Hold at ${fmtK(a.newReceipts)}/mo`,
      detail: "Compared against 18 months of receipts from your connected bank accounts.",
    },
    {
      id: "gap", type: "Cash-flow gap", severity: "Medium",
      title: correctedM6 === model.reserve
        ? `After the fix, Month ${PROTECT_THROUGH} sits exactly on your reserve`
        : correctedM6 < model.reserve
          ? `After the fix, Month ${PROTECT_THROUGH} falls ${fmtK(model.reserve - correctedM6)} below your reserve`
          : `After the fix, Month ${PROTECT_THROUGH} keeps only ${fmtK(correctedM6 - model.reserve)} above your reserve`,
      short: correctedM6 === model.reserve
        ? `Month ${PROTECT_THROUGH} lands on the ${fmtK(model.reserve)} reserve`
        : `Month ${PROTECT_THROUGH} has a ${fmtK(correctedM6 - model.reserve)} buffer, no downside`,
      location: `Forecast!H30`,
      found: `With costs included, the base case ends Month ${PROTECT_THROUGH} at ${fmtK(correctedM6)}. The model has no downside case, which falls to ${fmtK(model.plan.downside.cash[PROTECT_THROUGH])}.`,
      why: model.plan.downside.cash[PROTECT_THROUGH] < model.reserve
        ? "Without a downside case, the plan looks safe — but it breaks the reserve the first time receipts slip."
        : "The plan holds in the downside too, but the model should show it.",
      impact: [
        { label: "Base case, Month 6", before: fmtK(correctedM6), after: fmtK(correctedM6) },
        { label: "Downside case, Month 6", before: "Not modeled", after: fmtK(model.plan.downside.cash[PROTECT_THROUGH]) },
      ],
      approveLabel: "Add a downside sheet",
      link: { label: "Compare in your NYC analysis", go: "scenarios" },
      detail: "Uses the same calculation engine as Create, with this model’s inputs.",
    },
    {
      id: "payroll", type: "Missing driver", severity: "Low",
      title: "No payroll taxes or benefits on NYC hires",
      short: "No payroll taxes or benefits on NYC hires",
      location: "Assumptions!B12:B14",
      found: `NYC team costs are ${fmtK(a.teamCost)}/mo with no employer taxes or benefits. These typically add 15–25% of salary — confirm with your payroll provider.`,
      why: "Loaded cost, not salary, is what leaves the bank.",
      impact: [
        { label: "NYC team costs", before: `${fmtK(a.teamCost)}/mo`, after: `${fmtK(a.teamCost + loadMonthly)}/mo` },
        { label: `Month-${PROTECT_THROUGH} ending cash`, before: fmtK(correctedM6), after: fmtK(loaded.cash[PROTECT_THROUGH]) },
      ],
      approveLabel: `Add ${Math.round(PAYROLL_LOAD * 100)}% load`,
      detail: `The ${Math.round(PAYROLL_LOAD * 100)}% load is an assumption, shown separately so you can change it.`,
    },
  ];
}

// Charts: hand-built SVG so every mark, tick and label comes from one scale.

const SERIES_STYLE = {
  focus: { stroke: "var(--chart-focus)", strokeWidth: 3, dash: null },
  dash: { stroke: "var(--ink-2)", strokeWidth: 2, dash: "9 6" },
  dot: { stroke: "var(--ink-2)", strokeWidth: 2, dash: "2 5" },
  muted: { stroke: "var(--chart-muted)", strokeWidth: 2, dash: null },
  alt: { stroke: "var(--warn-fill)", strokeWidth: 2, dash: "14 5 3 5" },
};

// Points for a series, stopping where cash reaches zero (with the exact crossing).
function seriesPoints(cash) {
  const pts = [];
  for (let m = 0; m < cash.length; m++) {
    if (cash[m] >= 0) { pts.push([m, cash[m]]); continue; }
    const prev = cash[m - 1];
    if (m > 0 && prev > 0) pts.push([m - 1 + prev / (prev - cash[m]), 0]);
    break;
  }
  return pts;
}

function LegendSwatch({ variant }) {
  const s = SERIES_STYLE[variant];
  return (
    <svg width="26" height="8" aria-hidden="true">
      <line x1="1" y1="4" x2="25" y2="4" style={{ stroke: s.stroke, strokeWidth: s.strokeWidth, strokeDasharray: s.dash || "none", strokeLinecap: "round" }} />
    </svg>
  );
}

function CashChart({ series, reserve, height = 300, width = 760, marker, showLegend = true, ariaLabel }) {
  const W = width, H = height;
  const pad = { l: 58, r: 16, t: 16, b: 30 };
  const plotW = W - pad.l - pad.r, plotH = H - pad.t - pad.b;
  const maxVal = Math.max(reserve || 0, ...series.flatMap((s) => s.cash));
  const yMax = Math.max(100000, Math.ceil(maxVal / 100000) * 100000);
  const x = (m) => pad.l + (m / HORIZON) * plotW;
  const y = (v) => pad.t + (1 - v / yMax) * plotH;
  const ticks = [];
  for (let v = 0; v <= yMax; v += yMax > 600000 ? 200000 : 100000) ticks.push(v);

  const [hover, setHover] = useState(null);
  const svgRef = useRef(null);
  const onMove = (e) => {
    const rect = svgRef.current.getBoundingClientRect();
    const mx = ((e.clientX - rect.left) / rect.width) * W;
    const m = Math.round(((mx - pad.l) / plotW) * HORIZON);
    setHover(Math.max(0, Math.min(HORIZON, m)));
  };

  const focus = series.find((s) => s.variant === "focus");
  const focusPts = focus ? seriesPoints(focus.cash) : [];
  const focusEnd = focusPts[focusPts.length - 1];

  return (
    <div className="stack" style={{ gap: 12 }}>
      <div className="chart-wrap">
        <svg
          ref={svgRef}
          viewBox={`0 0 ${W} ${H}`}
          role="img"
          aria-label={ariaLabel || "Month-end cash projection"}
          onMouseMove={onMove}
          onMouseLeave={() => setHover(null)}
        >
          {ticks.map((v) => (
            <g key={v}>
              <line x1={pad.l} x2={W - pad.r} y1={y(v)} y2={y(v)} style={{ stroke: "var(--chart-grid)", strokeWidth: 1 }} />
              <text x={pad.l - 10} y={y(v) + 4} textAnchor="end" style={{ fill: "var(--muted)", fontSize: 12, fontFamily: "var(--font-mono)" }}>
                {v === 0 ? "$0" : fmtK(v)}
              </text>
            </g>
          ))}
          {[0, 3, 6, 9, 12].map((m) => (
            <text key={m} x={x(m)} y={H - 8} textAnchor="middle" style={{ fill: "var(--muted)", fontSize: 12, fontFamily: "var(--font-mono)" }}>
              M{m}
            </text>
          ))}
          {reserve != null && (
            <g>
              <line x1={pad.l} x2={W - pad.r} y1={y(reserve)} y2={y(reserve)} style={{ stroke: "var(--crit-fill)", strokeWidth: 1.5, strokeDasharray: "5 4" }} />
              <text x={W - pad.r} y={y(reserve) - 7} textAnchor="end" style={{ fill: "var(--ink)", fontSize: 12, fontWeight: 600 }}>
                Reserve floor {fmtK(reserve)}
              </text>
            </g>
          )}
          {series.filter((s) => s.variant !== "focus").concat(focus ? [focus] : []).map((s) => {
            const st = SERIES_STYLE[s.variant];
            const d = seriesPoints(s.cash).map(([m, v], i) => `${i ? "L" : "M"}${x(m).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
            return (
              <path key={s.id} d={d} fill="none" style={{ stroke: st.stroke, strokeWidth: st.strokeWidth, strokeDasharray: st.dash || "none", strokeLinecap: "round", strokeLinejoin: "round" }} />
            );
          })}
          {focusEnd && (
            <circle cx={x(focusEnd[0])} cy={y(focusEnd[1])} r="5" style={{ fill: "var(--chart-focus)", stroke: "var(--surface)", strokeWidth: 2 }} />
          )}
          {marker && (
            <g>
              <circle cx={x(marker.month)} cy={y(marker.value)} r="6" style={{ fill: "var(--surface)", stroke: "var(--crit-fill)", strokeWidth: 2.5 }} />
              <text x={x(marker.month) - 12} y={y(marker.value) + 22} textAnchor="end" style={{ fill: "var(--crit)", fontSize: 12, fontWeight: 600 }}>
                {marker.label}
              </text>
            </g>
          )}
          {hover != null && (
            <g pointerEvents="none">
              <line x1={x(hover)} x2={x(hover)} y1={pad.t} y2={H - pad.b} style={{ stroke: "var(--rule-strong)", strokeWidth: 1 }} />
              {series.map((s) =>
                s.cash[hover] != null && s.cash[hover] >= 0 ? (
                  <circle key={s.id} cx={x(hover)} cy={y(s.cash[hover])} r="4.5" style={{ fill: SERIES_STYLE[s.variant].stroke, stroke: "var(--surface)", strokeWidth: 2 }} />
                ) : null
              )}
            </g>
          )}
          <rect x={pad.l} y={pad.t} width={plotW} height={plotH} fill="transparent" />
        </svg>
        {hover != null && (
          <div
            className="chart-tip"
            style={{
              left: `calc(${(x(hover) / W) * 100}% ${hover > 7 ? "- 206px" : "+ 14px"})`,
              top: 8,
            }}
          >
            <div className="eyebrow" style={{ marginBottom: 6 }}>End of Month {hover}</div>
            {series.map((s) => (
              <div className="tip-row" key={s.id}>
                <span className="row" style={{ gap: 6 }}><LegendSwatch variant={s.variant} /> {s.short || s.label}</span>
                <span className="strong">{s.cash[hover] < 0 ? "Out of cash" : fmtK(s.cash[hover])}</span>
              </div>
            ))}
            {reserve != null && (
              <div className="tip-row muted" style={{ marginTop: 4 }}>
                <span>Reserve floor</span><span>{fmtK(reserve)}</span>
              </div>
            )}
          </div>
        )}
      </div>
      {showLegend && series.length > 1 && (
        <div className="legend">
          {series.map((s) => (
            <span className="legend-item" key={s.id}><LegendSwatch variant={s.variant} /> {s.label}</span>
          ))}
        </div>
      )}
    </div>
  );
}

    }, 1100);
  };

function DepositReview({ onClose }) {
  const { set, toast } = useStore();
  const [types, setTypes] = useState(() => Object.fromEntries(FLAGGED_DEPOSITS.map((d) => [d.id, d.suggested])));
  const revenue = FLAGGED_DEPOSITS.filter((d) => types[d.id] === "revenue").reduce((t, d) => t + d.amount, 0);
  return (
    <Modal title="Review 3 uncategorized deposits" onClose={onClose} wide>
      <p className="small muted" style={{ margin: 0 }}>
        Only revenue counts toward receipts. We’ve suggested a type from the sender and amount — change anything that’s wrong.
      </p>
      <div className="table-wrap">
        <table className="data">
          <thead><tr><th>Date</th><th>From</th><th style={{ textAlign: "right" }}>Amount</th><th>Type</th></tr></thead>
          <tbody>
            {FLAGGED_DEPOSITS.map((d) => (
              <tr key={d.id}>
                <td style={{ whiteSpace: "nowrap" }}>{d.date}</td>
                <td className="first">{d.from}</td>
                <td style={{ textAlign: "right" }}>{fmtMoney(d.amount)}</td>
                <td>
                  <select className="select" style={{ minWidth: 230 }} aria-label={`Type for ${d.from}`} value={types[d.id]} onChange={(e) => setTypes((t) => ({ ...t, [d.id]: e.target.value }))}>
                    {DEPOSIT_TYPES.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
                  </select>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="panel small">
        {revenue > 0
          ? `${fmtMoney(revenue)} marked as revenue. In the full product this would raise average receipts; this demo keeps the sample company’s numbers fixed.`
          : "None of these count as revenue, so average receipts stay at " + fmtMoney(COMPANY.monthlyReceipts) + "/mo."}
      </div>
      <div className="row" style={{ justifyContent: "flex-end" }}>
        <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
        <button className="btn btn-primary" onClick={() => { set((s) => { s.depositsReviewed = true; }); toast("3 deposits categorized"); onClose(); }}>Save categories</button>
      </div>
    </Modal>
  );
}

const TARGET_MONTHS =["Month 1", "Month 2", "Month 3", "Month 4", "Month 6", "Month 9", "Month 12"];
const TARGET_COLUMNS = "minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)";

function TargetRow({ goalLabel, name, onName, onRemove, value, onValue, by, onBy, saved, onSaved, help, suggested }) {
  return (
    <div className="stack" style={{ gap: 6, padding: "12px 0" }}>
      <div className="grid-4" style={{ gridTemplateColumns: TARGET_COLUMNS, alignItems: "center" }}>
        {onName ? (
          <input className="input" value={name} placeholder="What are you saving for?" aria-label="Goal name" onChange={(e) => onName(e.target.value)} />
        ) : (
          <span className="strong">{name}</span>
        )}
        <MoneyInput value={value} onChange={onValue} ariaLabel={`${name} target`} />
        {onBy ? (
          <select className="select" value={by} onChange={(e) => onBy(e.target.value)} aria-label={`${name} by when`}>
            {TARGET_MONTHS.map((m) => <option key={m}>{m}</option>)}
          </select>
        ) : (
          <span className="small muted">Always</span>
        )}
        {onSaved ? (
          <MoneyInput value={saved} onChange={onSaved} ariaLabel={`${name} already set aside`} />
        ) : suggested ? (
          <span className="tag tag-goal" style={{ justifySelf: "start" }}>Suggested</span>
        ) : (
          <span />
        )}
      </div>
      <div className="row-between">
        <span className="help">{goalLabel ? `For “${goalLabel}.” ` : ""}{help}</span>
        {onRemove && <button className="btn btn-quiet btn-sm" onClick={onRemove}>Remove</button>}
      </div>
    </div>
  );
}

const OVERDUE = [

];

function isNycQuestion(text) {
  return /nyc|new york|expan|city|team activit|afford/i.test(text);
}

function SyncBanner() {
  const { state, set, go, toast } = useStore();
  const [retrying, setRetrying] = useState(false);
  if (state.syncIssue !== "failed") return null;
  const retry = () => {
    setRetrying(true);
    setTimeout(() => {
      setRetrying(false);
      set((s) => { s.syncIssue = null; });
      toast("Rho synced — numbers are up to date");
    }, 1300);
  };
  return (
    <div className="banner banner-crit" role="alert">
      <div className="stack" style={{ gap: 2 }}>
        <span className="strong">Rho hasn’t synced for 3 hours</span>
        <span className="small">Numbers below use Rho data up to 9:02 AM. They’re labeled stale until the next sync.</span>
      </div>
      <div className="row wrap">
        <button className="btn btn-primary btn-sm" onClick={retry} disabled={retrying}>{retrying ? "Syncing…" : "Retry sync"}</button>
        <button className="btn btn-secondary btn-sm" onClick={() => go("connect", { manage: true })}>Reconnect Rho</button>
        <button className="btn btn-quiet btn-sm" onClick={() => set((s) => { s.syncIssue = "accepted"; })}>Continue with last sync</button>
      </div>
    </div>
  );
}

function reviewRow(state) {
  const v = state.validation;
  if (v.stage !== "ready") return null;
  const decided = Object.keys(v.decisions).length;
  if (v.savedVersion) return { tag: `Reviewed · ${v.savedVersion.approved} approved, ${v.savedVersion.rejected} rejected`, tone: "tag-good", when: "Today" };
  return { tag: `In review · 4 findings, ${decided} resolved`, tone: "tag-warn", when: "Today" };
}

    set((s) => { if (s.analysis.status === "none") s.analysis.status = "draft"; });

  return (

function RecommendationsScreen() {
  const { state, set, go, toast, model } = useStore();
  const [openWhy, setOpenWhy] = useState({});
  const [detail, setDetail] = useState(null);
  const recs = buildRecommendations(state, model);
  const done = state.analysis.status === "done";

  const hide = (r, verb) => {
    set((s) => { s.hiddenRecs[r.id] = true; });
    toast(`${verb}: ${r.title}`, { label: "Undo", run: () => set((s) => { delete s.hiddenRecs[r.id]; }) });
  };
  const act = (r) => {
    if (r.go === "questions") { set((s) => { if (s.analysis.status === "none") s.analysis.status = "draft"; }); go("questions"); }

    else setDetail(r.id);
  };

  const summary = done
    ? [
        `Cash covers ${fmtMonths(model.none.runway)} today. With the NYC plan, that falls to about ${Math.floor(model.rec.downside.runway)} months.`,
        `NYC adds a one-time setup cost and ${fmtK(state.analysis.teamCost)}/mo in team costs before new receipts catch up.`,
        "Work through these in order. The top two protect runway; the others free up cash.",

    : [
        `Cash covers ${fmtMonths(model.none.runway)} today at a ${fmtK(model.netBurnToday)}/mo net burn.`,

          {recs.map((r) => (
            <section key={r.id} className="card pad rec-card" aria-label={r.title}>
              <div className="row-between">
                <span className="eyebrow">{r.category}</span>
                <span className={"tag " + (r.impact === "High" ? "tag-dark" : "")}>{r.impact} impact</span>

              <div className="why stack" style={{ gap: 4 }}>
                <span className="eyebrow">Why we suggest this</span>
                <span className="small">{r.why}</span>
                {openWhy[r.id] && (
                  <span className="small muted">
                    {r.provenance === "actual"
                      ? "Calculated from your connected accounts. No assumptions involved."
                      : `Uses your NYC assumptions (team ${fmtK(state.analysis.teamCost)}/mo, receipts ${fmtK(state.analysis.newReceipts)}/mo from Month ${state.analysis.receiptsStart}). Change them and this updates.`}

          <div className="row" style={{ justifyContent: "flex-end" }}>
            <button className="btn btn-secondary" onClick={() => setDetail(null)}>Close</button>

function QuestionsScreen() {
  const { state, set, go } = useStore();
  const a = state.analysis;
  const [tried, setTried] = useState(false);
  const burn = COMPANY.monthlyOutflows - COMPANY.monthlyReceipts;
  const reserve = a.reserve ?? state.goals.reserve;
  const rangeBad = a.setupRange && (a.setupRange.low == null || a.setupRange.high == null || a.setupRange.low > a.setupRange.high);
  const required = [rangeBad ? null : a.setup, a.teamCost, a.newReceipts, reserve];
  const answered = required.filter((v) => v != null).length;
  const complete = answered === required.length;
  const upd = (fn) => set((s) => fn(s.analysis));

  const build = () => {
    setTried(true);
    if (!complete) return;
    set((s) => { s.analysis.testSetup = s.analysis.setup; if (s.analysis.status === "none") s.analysis.status = "draft"; });
    go("scenarios");
  };

  return (
    <>
      <TopBar />
      <main className="page">
        <Crumbs />
        <Stepper current={2} />
        <QuestionBanner />
        <div className="grid-main rail-left">
          <section className="card pad stack" style={{ gap: 6 }} aria-label="From your accounts">
            <div className="row-between"><h2 className="h2">From your accounts</h2><Prov kind="actual" /></div>
            <span className="small muted">We already know these. You don’t need to type them.</span>
            <div className="divider-list" style={{ marginTop: 6 }}>
              <div className="kv"><span className="k">Opening cash</span><span className="v">{fmtMoney(COMPANY.openingCash)}</span></div>
              <div className="kv"><span className="k">Monthly receipts (avg.)</span><span className="v">{fmtMoney(COMPANY.monthlyReceipts)}</span></div>
              <div className="kv"><span className="k">Monthly outflows (avg.)</span><span className="v">{fmtMoney(COMPANY.monthlyOutflows)}</span></div>
              <div className="kv"><span className="k">Net burn</span><span className="v">{fmtMoney(burn)} / mo</span></div>
              <div className="kv"><span className="k">Runway today</span><span className="v">{fmtMonths(COMPANY.openingCash / burn)}</span></div>
            </div>
            <div className="panel small muted" style={{ marginTop: 8 }}>
              Sources: Rho Checking ••4821 · Chase Savings ••9930 (Plaid) · QuickBooks · last 6 months · synced 2 min ago
            </div>
          </section>

          <section className="card pad stack" style={{ gap: 18 }} aria-label="What we need from you">
            <div className="row-between">
              <h2 className="h2">What we need from you</h2>
              <span className={"small " + (complete ? "muted" : "")} style={{ color: complete ? undefined : "var(--crit)" }}>
                {complete ? "All 4 required answered" : `${answered} of 4 required answered`}
              </span>
            </div>
            <span className="small muted" style={{ marginTop: -10 }}>Only the inputs this question needs. Your bank data can’t see the future.</span>

            <div className="field">
              <div className="row-between"><label className="field-label" htmlFor="q-setup">One-time NYC setup (activities + equipment)</label><Prov kind="assumption" /></div>
              <Seg label="Setup amount type" value={a.setupRange ? "range" : "one"}
                onChange={(v) => upd((x) => {
                  if (v === "range" && !x.setupRange) x.setupRange = { low: Math.min(35000, x.setup ?? 35000), high: x.setup ?? 60000 };
                  if (v === "one") x.setupRange = null;
                  if (x.setupRange) x.setup = x.setupRange.high;
                })}
                options={[{ value: "one", label: "One amount" }, { value: "range", label: "Not sure — a range" }]} />
              <div className="row wrap">
                {a.setupRange ? (
                  <>
                    <div style={{ flex: 1, minWidth: 140 }}><MoneyInput id="q-setup" ariaLabel="Lowest likely setup" value={a.setupRange.low} invalid={tried && rangeBad} onChange={(v) => upd((x) => { x.setupRange.low = v; })} /></div>
                    <span className="muted">to</span>
                    <div style={{ flex: 1, minWidth: 140 }}><MoneyInput ariaLabel="Highest likely setup" value={a.setupRange.high} invalid={tried && rangeBad} onChange={(v) => upd((x) => { x.setupRange.high = v; x.setup = v; })} /></div>
                  </>
                ) : (
                  <div style={{ flex: 1, minWidth: 180 }}><MoneyInput id="q-setup" value={a.setup} invalid={tried && a.setup == null} onChange={(v) => upd((x) => { x.setup = v; })} /></div>
                )}
                <select className="select" style={{ width: 170 }} aria-label="When setup is paid" value={a.setupMonth} onChange={(e) => upd((x) => { x.setupMonth = Number(e.target.value); })}>
                  {SETUP_TIMING.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
              </div>
              <span className="help" style={tried && (a.setup == null || rangeBad) ? { color: "var(--crit)" } : undefined}>
                {tried && rangeBad
                  ? "Enter both ends of the range, low first."
                  : tried && a.setup == null
                    ? "Enter your planned setup cost — we won’t guess it."
                    : a.setupRange
                      ? "We test the high end and tell you how much of the range is safe."
                      : "Not sure? Switch to a range."}
              </span>
            </div>

            <div className="field">
              <div className="row-between"><label className="field-label" htmlFor="q-team">Ongoing NYC team costs, per month</label><Prov kind="assumption" /></div>
              <div className="row wrap">
                <div style={{ flex: 1, minWidth: 180 }}><MoneyInput id="q-team" value={a.teamCost} invalid={tried && a.teamCost == null} onChange={(v) => upd((x) => { x.teamCost = v; })} /></div>
                <select className="select" style={{ width: 170 }} aria-label="When team costs start" value={a.teamStart} onChange={(e) => upd((x) => { x.teamStart = Number(e.target.value); })}>
                  {TEAM_TIMING.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
              </div>
              <span className="help">Team activities, workspace, travel.</span>
            </div>

            <div className="field">
              <div className="row-between"><label className="field-label" htmlFor="q-rec">New monthly receipts from NYC</label><Prov kind="assumption" /></div>
              <div className="row wrap">
                <div style={{ flex: 1, minWidth: 180 }}><MoneyInput id="q-rec" value={a.newReceipts} invalid={tried && a.newReceipts == null} onChange={(v) => upd((x) => { x.newReceipts = v; })} /></div>
                <label className="small muted" htmlFor="q-start">Cash arrives from</label>
                <select id="q-start" className="select" style={{ width: 130 }} value={a.receiptsStart} onChange={(e) => upd((x) => { x.receiptsStart = Number(e.target.value); })}>
                  {[1, 2, 3, 4, 5, 6].map((m) => <option key={m} value={m}>Month {m}</option>)}
                </select>
              </div>
              <span className="help">When does cash actually land in the bank — not when deals close? The downside assumes half, a month later.</span>
            </div>

            <div className="field">
              <div className="row-between"><label className="field-label" htmlFor="q-reserve">Minimum cash reserve</label><Prov kind="goal" /></div>
              <MoneyInput id="q-reserve" value={reserve} onChange={(v) => upd((x) => { x.reserve = v; })} />
              <span className="help">Set during setup. Change it here for this analysis only.</span>
            </div>

            <div className="panel stack" style={{ gap: 10, border: "1px dashed var(--rule-strong)", background: "transparent" }}>
              <div className="row-between"><span className="field-label">Any new funding in the next 12 months?</span><span className="tag">Optional</span></div>
              <Seg label="New funding" value={a.funding} onChange={(v) => upd((x) => { x.funding = x.funding === v ? null : v; })}
                options={[{ value: "no", label: "No" }, { value: "yes", label: "Yes — add a raise" }, { value: "unsure", label: "Not sure" }]} />
              {a.funding === "yes" && <span className="help">Raise modeling is coming soon. For now scenarios assume no new funding and tell you when to start raising.</span>}
            </div>
          </section>
        </div>
        <div className="footer-bar">
          <button className="btn btn-ghost" onClick={() => go("home")}>← Back to Home</button>
          <div className="row">
            {tried && !complete && <span className="small" style={{ color: "var(--crit)" }}>Fill the highlighted fields to build scenarios.</span>}

function RecommendationScreen() {
  const store = useStore();
  const { state, set, go, toast } = store;
  const a = state.analysis;
  const [view, setView] = useState("cash");
  const [asked, setAsked] = useState([]);
  const [draft, setDraft] = useState("");
  const [brief, setBrief] = useState(false);
  const [calc, setCalc] = useState(null);

  // Reaching the recommendation (by button, link or the demo menu) completes the analysis.
  useEffect(() => {
    if (a.status !== "done" || !a.computedWith) set((s) => { s.analysis.status = "done"; s.analysis.computedWith = s.analysis.computedWith || answerInputs(s); });
  }, [a.status, a.computedWith, set]);

  const stale = isStale(state);
  const shownState = stale ? withInputs(state, a.computedWith) : state;
  const model = stale ? buildModel(shownState) : store.model;
  const changed = stale ? ANSWER_INPUTS.filter((k) => answerInputs(state)[k] !== a.computedWith[k]) : [];
  const answers = askAnswers(shownState, model);
  const d = model.rec.downside;
  const toneTag = model.verdict === "Viable as planned" ? "tag-good" : model.verdict === "Not viable yet" ? "tag-crit" : "tag-warn";
  const sa = shownState.analysis;

  const cashRows = [
    ["Receipts", fmtK(COMPANY.monthlyReceipts), `${fmtK(model.downReceipts)} from Month ${model.downStart}`, `+${fmtK(sa.newReceipts / 2)}`],
    ["Operating costs", fmtK(COMPANY.monthlyOutflows), `${fmtK(model.costsWithNyc)} from Month ${sa.teamStart}`, `+${fmtK(sa.teamCost)}`],
    ["   New budget line: NYC team", "—", fmtK(sa.teamCost), "Not in current budget"],
    ["One-time: NYC setup", "—", `${fmtK(model.chosen)} ${setupWhen(sa.setupMonth)}`, `+${fmtK(model.chosen)}`],
  ];
  const plRows = [
    ["Revenue (accrual)", fmtK(COMPANY.monthlyReceipts), `${fmtK(model.downReceipts)} from Month ${model.downStart}`, `+${fmtK(sa.newReceipts / 2)}`],
    ["Operating expenses", fmtK(COMPANY.monthlyOutflows), fmtK(model.costsWithNyc), `+${fmtK(sa.teamCost)}`],
    ["Team activities (expensed)", "—", `${fmtK(Math.round(model.chosen * 0.4))} when paid`, "One-off"],
    ["Equipment (capitalized, 3 yrs)", "—", `${fmtK(Math.round((model.chosen * 0.6) / 36))}/mo depreciation`, `${fmtK(Math.round(model.chosen * 0.6))} asset`],
  ];
  const budgetRows = [
    ["NYC team (new line)", "Not budgeted", `${fmtK(sa.teamCost)}/mo`, "Add to budget"],
    ["NYC setup", `${fmtK(sa.setup)} planned`, `${fmtK(model.chosen)} cap`, model.planHolds ? "Within plan" : `−${fmtK(sa.setup - model.chosen)} vs plan`],
    ["Marketing", fmtK(5000) + "/mo", fmtK(5000) + "/mo", "No change"],
    ["Software", fmtK(9000) + "/mo", fmtK(9000) + "/mo", "Review 3 tools"],
  ];
  const rows = view === "cash" ? cashRows : view === "pl" ? plRows : budgetRows;
  const heads = view === "budget" ? ["Line", "Budget", "With NYC plan", "Variance"] : ["Line (monthly)", "Today", "With NYC plan", "Change"];

  const ask = (text) => {
    const t = text.toLowerCase();
    const hit = answers.find((x) => x.q === text) ||
      (/calcul|math|formula|how is/.test(t) && answers.find((x) => x.calc)) ||
      (/runway|drop/.test(t) && answers[0]) ||
      (/month 2|start|earlier/.test(t) && answers[2]) ||
      (/cap|35|why \$|setup/.test(t) && answers[1]);
    setAsked((q) => [...q, { q: text, a: hit ? hit.a : "In this demo I can answer questions about runway, the setup cap, receipt timing and how the numbers are calculated. Try one of the suggestions.", calc: hit && hit.calc }]);
    setDraft("");
  };

  const recalc = () => {
    set((s) => { s.analysis.computedWith = answerInputs(s); s.analysis.version += 1; });
    toast(`Recalculated — saved as version ${a.version + 1}`);
  };
  const undo = () => {
    set((s) => {
      const { reserve, ...rest } = s.analysis.computedWith;
      Object.assign(s.analysis, rest);
      s.analysis.reserve = reserve === s.goals.reserve ? null : reserve;
      s.analysis.testSetup = s.analysis.setup;
    });
    toast("Change undone — back to the last answer");
  };

  return (
    <>

          <section className="card pad card-emph stack" style={{ gap: 16 }} aria-label="Recommendation">
            <div className="row wrap" style={{ gap: 8 }}>
              <span className="tag tag-dark">Recommendation</span>

                options={[{ value: "cash", label: "Cash view" }, { value: "pl", label: "P&L view (QuickBooks)" }, { value: "budget", label: "Budget view" }]} />
